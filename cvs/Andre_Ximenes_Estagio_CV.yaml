    Resumo Profissional:
      - Sou estudante de Análise e Desenvolvimento de Sistemas (4º semestre), com experiência prática em TypeScript (Node.js, NestJS/Hono e PostgreSQL). Quero um estágio em que eu escreva código de verdade em time, com espaço para errar, aprender e melhorar a cada entrega. Já atuei em um produto de seguros, usando Git/GitHub, Docker, SQL e testes. Uso LLMs no dia a dia e me responsabilizo pela qualidade do que sai. Comunico de forma clara, peço ajuda quando preciso e busco feedback para crescer.
    Experiência Profissional:
      - company: Stackup Software
        position: Desenvolvedor Fullstack
        date:
        start_date: 2025-10
        end_date: 2026-02
        location: Remoto
        summary: "[stackup-software.netlify.app](https://stackup-software.netlify.app)"
        highlights:
          - Entreguei frontend e backend de uma plataforma de seguros e garantias, do requisito ao deploy, em ritmo de software house com contato direto com o cliente.
          - Modelei permissões (RBAC) e fluxos de proposta com impacto financeiro, evitando alterações indevidas em estados sensíveis.
          - Implementei upload direto ao AWS S3 e processamento com Lambda (OCR/documentos), reduzindo carga na API e tempo de emissão.
          - Trabalhei com PostgreSQL, Prisma, Git/GitHub e revisão de código no dia a dia do time.
          - Participei do refinamento de regras de negócio com produto, traduzindo domínio do seguro em entregas incrementais.
