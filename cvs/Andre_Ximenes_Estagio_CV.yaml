          - Isolamento multi-tenant e máquina de estados de vagas/candidaturas com histórico auditável.
          - CI separado (API/Web), health checks e deploy em produção.
      - name: Ecommerce - API Hono, loja Astro e domínio de pedidos | Projeto de Portfólio
        date:
        start_date:
        end_date:
        location:
        summary: "[ecommerce.andreximenes.xyz](https://ecommerce.andreximenes.xyz) | [github.com/AndreXime/ecommerce](https://github.com/AndreXime/ecommerce)"
