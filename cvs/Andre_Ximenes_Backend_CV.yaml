  sections:
    Resumo Profissional:
      - Desenvolvedor Backend com atuação no ciclo completo de APIs RESTful utilizando TypeScript, Node.js, NestJS e Hono, com foco em performance, segurança e escalabilidade. Experiência na modelagem de dados relacionais com PostgreSQL, implementação de autenticação baseada em JWT e RBAC, e arquitetura de pipelines assíncronos com AWS S3, AWS Lambda e filas via BullMQ. Perfil direcionado ao desenvolvimento backend robusto, traduzindo regras de negócio em soluções resilientes. Base prática em projetos com Docker, Redis e integração de serviços externos. Atuação em ambiente colaborativo com metodologias ágeis e boas práticas de qualidade de código.
    Experiência Profissional:
      - company: Stackup Software
        position: Desenvolvedor Backend
        date:
        start_date: 2025-10
        end_date: 2026-02
        location: Remoto
        summary: "[stackup-software.netlify.app](https://stackup-software.netlify.app)"
        highlights:
          - Projetou e manteve API RESTful utilizando TypeScript e Hono com validação estrita de payloads via Zod e persistência em PostgreSQL, garantindo alta disponibilidade com estratégia de reconexão via backoff exponencial.
          - Modelou sistema de permissões baseado em tokens (RBAC) para governança de estado das propostas de seguros, eliminando o risco de alterações indevidas em fluxos financeiros e de análise.
          - Implementou pipeline assíncrono para processamento de documentos sensíveis integrando AWS S3 e AWS Lambda com execução de OCR e reconciliação dos dados extraídos diretamente com o banco de dados PostgreSQL.
          - Automatizou a geração de contratos jurídicos dinâmicos lendo templates versionados em nuvem, reduzindo gargalos operacionais e tempo de emissão de documentos na plataforma de seguros.
          - Desenvolveu módulos de integração com APIs externas para consumo de dados de parceiros, organizando adaptadores internos para manter o código desacoplado e de fácil manutenção.
          - Estruturou camadas de serviço e repositório seguindo separação de responsabilidades, garantindo modularidade e facilitando a evolução da plataforma sem impacto em fluxos existentes.
          - Colaborou com o time de produto na modelagem de requisitos e refinamento de regras de negócio, contribuindo para a cobertura completa dos fluxos da plataforma de seguros e garantias.
          - Adotou boas práticas de qualidade com Biome e Husky para padronização de código e prevenção de erros antes do commit, aumentando a estabilidade das entregas em produção.
    Projetos:
      - name: Deploy Talent - Plataforma de Recrutamento Multi-tenant | Projeto de Portfólio
        date:
        start_date:
        end_date:
        location:
        summary: "[deploy-talent.andreximenes.xyz](https://deploy-talent.andreximenes.xyz) | [github.com/AndreXime/deploy-talent](https://github.com/AndreXime/deploy-talent)"
        highlights:
          - Desenvolveu API REST em NestJS e TypeScript com arquitetura modular baseada em casos de uso, JWT + RBAC e validação de entrada com Zod, cobrindo fluxos B2B de recrutamento de ponta a ponta.
          - Implementou isolamento multi-tenant em PostgreSQL com tenant derivado do token JWT e extensão do client Prisma para filtrar/injetar tenantId, como segunda linha de defesa além dos use cases.
          - Modelou domínio de vagas e candidaturas com máquinas de estado explícitas, pipeline customizável por vaga e histórico auditável de transições entre etapas do processo seletivo.
          - Congelou o pipeline de cada vaga após publicação, para etapas não mudarem no meio de um processo seletivo ativo.
          - Configurou health checks (liveness/readiness), CI separado para API e Web, e deploy em produção com monólito modular (NestJS + Next.js).
