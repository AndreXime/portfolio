    Resumo Profissional:
      - "Desenvolvedor Fullstack com atuação no ciclo completo de produto em TypeScript: APIs com NestJS e Hono, interfaces com Next.js e React, e persistência em PostgreSQL. Experiência em autenticação JWT e RBAC, contratos tipados com Zod e pipelines assíncronos com AWS S3, AWS Lambda e BullMQ. Entrega ponta a ponta, do requisito ao deploy, com visão de como o front consome a API (auth, erros, paginação e estados de carregamento). Atuação colaborativa com Docker, Redis, CI/CD e metodologias ágeis."
    Experiência Profissional:
      - company: Stackup Software
        position: Desenvolvedor Fullstack
        date:
        start_date: 2025-10
        end_date: 2026-02
        location: Remoto
        summary: "[stackup-software.netlify.app](https://stackup-software.netlify.app)"
        highlights:
          - Entregou frontend e backend da plataforma de seguros e garantias, do levantamento de requisito ao deploy, cobrindo fluxos de proposta, documentos e emissão na interface e na API.
          - Implementou upload direto ao AWS S3 via URLs pré-assinadas no cliente, eliminando o tráfego de arquivos binários pela API e reduzindo o tamanho médio dos payloads em cerca de 70%.
          - Projetou rotinas serverless com AWS Lambda acionadas por S3 para OCR e conversão de documentos, isolando o processamento da API e reduzindo o consumo de CPU do servidor em mais de 50%.
          - Modelou permissões RBAC para governança de estado das propostas, eliminando alterações indevidas em fluxos financeiros e de análise.
          - Construiu motor de contratos dinâmicos a partir de templates versionados em nuvem, reduzindo o tempo de emissão de documentos de minutos para segundos.
    Projetos:
      - name: Deploy Talent - Plataforma de Recrutamento Multi-tenant | Projeto de Portfólio
        date:
        start_date:
        end_date:
        location:
        summary: "[deploy-talent.andreximenes.xyz](https://deploy-talent.andreximenes.xyz) | [github.com/AndreXime/deploy-talent](https://github.com/AndreXime/deploy-talent)"
        highlights:
          - "Construiu o produto ponta a ponta em TypeScript: API NestJS com casos de uso, JWT + RBAC e Zod, e web Next.js/React com formulários validados e TanStack Query para estado de servidor."
          - Implementou isolamento multi-tenant em PostgreSQL com tenant derivado do JWT e extensão do Prisma para filtrar/injetar tenantId, como segunda linha de defesa além dos use cases.
          - Modelou vagas e candidaturas com máquinas de estado, pipeline customizável por vaga e histórico auditável, cobrindo recrutador, candidato e site público de carreiras.
          - "Configurou health checks (liveness/readiness), CI separado para API e Web, e deploy em produção no monólito modular NestJS + Next.js."
      - name: Ecommerce Full Stack - API Hono, loja Astro e domínio de pedidos | Projeto de Portfólio
        date:
        start_date:
        end_date:
        location:
        summary: "[ecommerce.andreximenes.xyz](https://ecommerce.andreximenes.xyz) | [github.com/AndreXime/ecommerce](https://github.com/AndreXime/ecommerce)"
        highlights:
          - Desenvolveu monorepo com API REST em Hono (Bun) e loja SSR em Astro, compartilhando contrato OpenAPI/Zod, Prisma/PostgreSQL e Redis.
          - Implementou sessão JWT em cookies HttpOnly com refresh e revogação em Redis, unificando a semântica de autenticação entre SSR e cliente.
          - Modelou pedido como transação atômica com snapshot de preço e decremento condicional de estoque, além de RBAC entre vitrine e admin.
